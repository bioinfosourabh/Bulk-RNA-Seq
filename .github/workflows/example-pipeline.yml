name: example-pipeline

# Installs the R dependencies and runs the full pipeline (steps 00A-07) on the
# simulated example data in example/. The GEO download (step 00) is not run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  example:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "no"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libglpk-dev \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev \
            libtiff-dev libjpeg-dev libfontconfig1-dev libcairo2-dev \
            libmagick++-dev

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('install_packages.R') }}
          restore-keys: rlib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-

      - name: Cache gene-set data (msigdbr)
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/msigdbr
          key: msigdbr-${{ runner.os }}-v1

      - name: Install R packages
        run: Rscript install_packages.R

      - name: Run pipeline on example data
        run: Rscript run_pipeline.R --config example/config.yaml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-results
          path: example/results
          if-no-files-found: warn
